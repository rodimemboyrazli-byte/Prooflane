<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Prooflane Logo Sting</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope-regular.ttf") format("truetype");
        font-style: normal;
        font-weight: 400;
      }

      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope-extrabold.ttf") format("truetype");
        font-style: normal;
        font-weight: 800;
      }

      :root {
        --proof-paper: #f7f8f6;
        --industrial-ink: #14272d;
        --evidence-muted: #596d72;
        --signal-teal: #167a76;
        --signal-teal-dark: #0f5c59;
        --evidence-teal-pale: #e8f2f0;
        --structural-line: #cdd9d6;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: var(--signal-teal);
      }

      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--signal-teal);
        color: var(--industrial-ink);
        font-family: "Manrope", sans-serif;
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #logo-scene {
        display: grid;
        place-items: center;
      }

      /* The landing page's existing lockup, scaled only as a unit. */
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 13px 7px 8px;
        border-radius: 999px;
        background: rgba(247, 248, 246, .94);
        box-shadow: 0 12px 28px rgba(20, 39, 45, .14);
        color: var(--industrial-ink);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -.03em;
        line-height: normal;
        transform: scale(5.25);
        transform-origin: center;
      }

      .brand-mark {
        display: inline-flex;
        align-items: flex-end;
        gap: 3px;
        width: 25px;
        height: 23px;
        padding: 3px;
        transform: skewX(-10deg);
      }

      .brand-mark i {
        display: block;
        width: 5px;
        background: var(--signal-teal);
        transform-origin: center bottom;
        will-change: transform, opacity;
      }

      .brand-mark i:nth-child(1) { height: 9px; }
      .brand-mark i:nth-child(2) { height: 16px; }
      .brand-mark i:nth-child(3) { height: 22px; }

      .brand-wordmark {
        display: block;
        white-space: nowrap;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="prooflane-logo-sting"
      data-start="0"
      data-duration="1.5"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <section id="logo-scene" class="clip" data-start="0" data-duration="1.5" data-track-index="0">
        <div id="lockup" class="brand" aria-label="prooflane">
          <span class="brand-mark" aria-hidden="true"><i id="bar-one"></i><i id="bar-two"></i><i id="bar-three"></i></span>
          <span id="wordmark" class="brand-wordmark">prooflane</span>
        </div>
      </section>
    </div>

    <script>
      const compositionId = "prooflane-logo-sting";
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      function springEase(response, dampingFraction) {
        const omega = (2 * Math.PI) / response;
        const damping = dampingFraction;
        const dampedOmega = omega * Math.sqrt(1 - damping * damping);
        const position = (time) => 1 - Math.exp(-damping * omega * time) * (
          Math.cos(dampedOmega * time) + ((damping * omega) / dampedOmega) * Math.sin(dampedOmega * time)
        );
        const rate = damping * omega;
        const scan = 12 / rate;
        let settleTime = scan;

        for (let step = 4800; step >= 0; step -= 1) {
          const time = (step / 4800) * scan;
          if (Math.abs(1 - position(time)) > 0.001) {
            settleTime = ((step + 1) / 4800) * scan;
            break;
          }
        }

        const endPosition = position(settleTime);
        return {
          duration: settleTime,
          ease: (progress) => position(progress * settleTime) + progress * (1 - endPosition),
        };
      }

      const barSettle = springEase(0.36, 0.87);

      tl.fromTo(
        ".brand-mark i",
        { scaleY: 0.08, opacity: 0 },
        {
          scaleY: 1,
          opacity: 1,
          duration: barSettle.duration,
          ease: barSettle.ease,
          stagger: 0.16,
        },
        0.08,
      );
      tl.fromTo(
        "#wordmark",
        { x: -10, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        0.72,
      );

      window.__timelines[compositionId] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
